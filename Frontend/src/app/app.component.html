<app-search-bar (search)="performSearch($event)"></app-search-bar>

<app-movie-list [movies]="result.results"></app-movie-list>

@if(loaded == true) {
    <div class="paginator-container">
        <mat-paginator
        [length]="totalArticles"
        [pageSize]="pageSize"
        (page)="onPageChange($event)"
        aria-label="Select page">
       </mat-paginator>
    </div>
}
